name: geomind-backend

x-service: &service
  build:
    context: .
  image: geomind-backend:latest
  restart: unless-stopped
  stop_grace_period: 30s
  env_file: [.env.production]
  networks: [geomind]

services:
  fastapi:
    <<: *service
    container_name: geomind-fastapi
    command: [sh, -ec, 'python -m alembic upgrade head; exec python -m src.main --fastapi']
    networks: [geomind, traefik]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/v1/system/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.geomind-backend.rule=Host(`api.geomind.team`)
      - traefik.http.routers.geomind-backend.entrypoints=websecure
      - traefik.http.routers.geomind-backend.tls=true
      - traefik.http.routers.geomind-backend.tls.certresolver=letsencrypt
      - traefik.http.services.geomind-backend.loadbalancer.server.port=80

  celery:
    <<: *service
    container_name: geomind-celery
    command: [python, -m, src.main, --celery]

networks:
  geomind:
    external: true
    name: geomind
  traefik:
    external: true
    name: traefik
